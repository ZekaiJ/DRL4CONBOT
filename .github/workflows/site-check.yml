name: Validate companion site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/build.py
      - run: python scripts/validate.py
      - run: node scripts/test_library.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: companion-site-preview
          path: _site/
          retention-days: 7
